version: 2
updates:
  - package-ecosystem: pip
    directory: /python-backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /nextjs-frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /python-backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Moving to a new Python minor version is a deliberate change: native wheels
      # such as pydantic-core can lag behind it, and CI tests on 3.12, so it would
      # not catch a failing image build.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /nextjs-frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
