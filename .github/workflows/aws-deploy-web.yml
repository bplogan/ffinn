name: AWS deploy web

# Builds the Next.js frontend into ECR and restarts it on the shared Lightsail host (infra/aws/lightsail/ffinn).
# Pushes run it once the repository variable DEPLOY_TARGET is "aws"; it can always be started by hand.
# The API address is baked into the build: set the repository variable PUBLIC_API_URL to change it.

on:
  push:
    branches: [main]
    paths:
      - "nextjs-frontend/**"
      - "infra/aws/lightsail/ffinn/**"
      - ".github/workflows/aws-deploy-web.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: aws-deploy-ffinn-web
  cancel-in-progress: false

env:
  SERVICE: web
  IMAGE: ffinn-web

jobs:
  deploy:
    if: (vars.DEPLOY_TARGET == 'aws' || github.event_name == 'workflow_dispatch') && github.repository == 'bplogan/ffinn'
    name: Lightsail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: nextjs-frontend/package-lock.json

      - name: Type-check and test
        working-directory: nextjs-frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm test -- --passWithNoTests

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nextjs-frontend
          file: nextjs-frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.ffinn.ca' }}
          tags: |
            ${{ vars.AWS_ECR_REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ vars.AWS_ECR_REGISTRY }}/${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}

      - name: Deploy on the Lightsail host
        env:
          HOST: ${{ vars.LIGHTSAIL_HOST }}
          REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "ubuntu@$HOST" "sudo install -d -o ubuntu -g ubuntu /opt/ffinn"
          scp -q infra/aws/lightsail/ffinn/compose.yml infra/aws/lightsail/ffinn/site.caddy "ubuntu@$HOST:/opt/ffinn/"
          aws ecr get-login-password | ssh "ubuntu@$HOST" "docker login --username AWS --password-stdin $REGISTRY"
          ssh "ubuntu@$HOST" "REGISTRY=$REGISTRY bash /opt/edge/deploy-app.sh ffinn $SERVICE ${{ github.sha }}"
          echo "### ffinn web deployed to AWS" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
