name: Python API - Production Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Base branch to deploy (main after PR merge)'
        required: true
        type: string
      pr_number:
        description: 'Pull request number'
        required: false
        type: string
      generation_id:
        description: 'AI Agent generation ID'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies & run tests
        working-directory: python-backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          JWT_SECRET_KEY: test-ci-key
          ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMmJ5dA==
          ENVIRONMENT: test
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ -q

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & push production image to ACR
        run: |
          az acr build \
            --registry ${{ vars.AZURE_REGISTRY }} \
            --image "ffinn-api:${{ github.sha }}" \
            --image "ffinn-api:prod-${{ inputs.generation_id }}" \
            --image "ffinn-api:latest" \
            --file python-backend/Dockerfile \
            python-backend/

      - name: Deploy to production Container App
        run: |
          az containerapp update \
            --name ${{ vars.AZURE_CONTAINER_APP_NAME }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image "${{ vars.AZURE_REGISTRY }}.azurecr.io/ffinn-api:${{ github.sha }}"

      - name: Health check
        env:
          API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          sleep 20
          curl --fail --silent "$API_URL/api/monitoring/health" \
            | grep -q 'healthy' && echo "Production deploy PASSED" || (echo "Production deploy FAILED"; exit 1)

      - name: Report release status (success)
        if: success()
        run: |
          curl -s -X POST "${{ vars.API_BASE_URL }}/api/aiagent/callback/release-status" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Token: ${{ secrets.FFINN_CALLBACK_TOKEN }}" \
            -d "{\"generation_id\":\"${{ inputs.generation_id }}\",\"success\":true,\"production_url\":\"${{ vars.PRODUCTION_API_URL }}\"}"

      - name: Report release status (failure)
        if: failure()
        run: |
          curl -s -X POST "${{ vars.API_BASE_URL }}/api/aiagent/callback/release-status" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Token: ${{ secrets.FFINN_CALLBACK_TOKEN }}" \
            -d "{\"generation_id\":\"${{ inputs.generation_id }}\",\"success\":false,\"error\":\"Production deployment failed\"}"
